rename-session main

rename-window dotfiles
send-keys "cd ~/git/dotfiles && nvim -S"

new-window -n devices
split-window -v

REPO=Infrastructure
DIR="$HOME/git/sedimentum/$REPO"
new-window -n "$REPO"
send-keys "cd $DIR && nvim -S"
split-window -h
send-keys "cd $DIR/ansible"
split-window -v
send-keys "cd $DIR/ansible"

REPO=VigilanceCockpit
DIR="$HOME/git/sedimentum/$REPO"
new-window -n "$REPO"
send-keys "cd $DIR && [ -f venv/bin/activate ] && source venv/bin/activate; [ -f Session.vim ] && { nvim -S || true; } || nvim"
split-window -h
send-keys "cd $DIR && g sba"
split-window -v
send-keys "cd $DIR && gs"

REPO=VigilanceCockpitFrontend
DIR="$HOME/git/sedimentum/$REPO"
new-window -n "$REPO"
send-keys "cd $DIR && [ -f venv/bin/activate ] && source venv/bin/activate; [ -f Session.vim ] && { nvim -S || true; } || nvim"
split-window -h
send-keys "cd $DIR && g sba"
split-window -v
send-keys "cd $DIR && gs"

